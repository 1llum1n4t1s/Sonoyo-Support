name: 不具合報告
description: Sonoyo の動作に問題がある場合はこちらから報告してください。
title: "[不具合] "
labels:
  - 不具合
  - 要確認
body:
  - type: markdown
    attributes:
      value: |
        ご報告ありがとうございます。Issue は誰でも閲覧できます。検索語、OpenAI API キー、購入時のメールアドレス、6桁の確認コードなどの機密情報は記載しないでください。

  - type: checkboxes
    id: checks
    attributes:
      label: 投稿前の確認
      options:
        - label: 既存の Issue に同じ内容がないことを確認しました。
          required: true
        - label: 投稿内容に検索語、個人情報、認証情報が含まれていないことを確認しました。
          required: true

  - type: input
    id: sonoyo-version
    attributes:
      label: Sonoyo のバージョン
      description: ブラウザの拡張機能管理画面に表示されるバージョンを入力してください。
      placeholder: 例：1.0.2
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: ブラウザ
      options:
        - Google Chrome
        - Mozilla Firefox
        - その他の Chromium 系ブラウザ
    validations:
      required: true

  - type: input
    id: browser-version
    attributes:
      label: ブラウザのバージョン
      placeholder: 例：Chrome 140、Firefox 142
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS
      placeholder: 例：Windows 11 24H2、macOS 15.6

  - type: dropdown
    id: connection-mode
    attributes:
      label: LLM の接続方法
      options:
        - 自分の OpenAI API キー
        - 月額プラン
        - どちらでも発生する
        - 回答しない・不明
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 発生した問題
      description: 検索語や認証情報を伏せたうえで、何が起きたかを具体的に記載してください。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 問題が起きるまでの操作を、検索語や認証情報を含めずに順番に記載してください。
      placeholder: |
        1. Google 検索ページを開く
        2. …
        3. …すると問題が発生する
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待していた動作
      description: 本来どのような動作になると考えていたかを記載してください。
    validations:
      required: true

  - type: textarea
    id: frequency
    attributes:
      label: 発生頻度
      description: 毎回、時々、一度だけなど、分かる範囲で記載してください。

  - type: textarea
    id: logs
    attributes:
      label: ログや画像
      description: 必要に応じて、検索語、個人情報、認証情報を取り除いたログやスクリーンショットを添付してください。

  - type: textarea
    id: additional-context
    attributes:
      label: その他の情報
      description: 最近行った設定変更や、問題に関係しそうな情報があれば記載してください。
